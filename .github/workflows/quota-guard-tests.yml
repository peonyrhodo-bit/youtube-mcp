name: YouTube quota guard tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quota-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run quota guard tests
        run: PYTHONPATH=. pytest -q tests/test_quota_guard.py
